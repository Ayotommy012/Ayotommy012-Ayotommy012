<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250" width="800" height="250">
    <style>
        .bg { fill: #0d1117; stroke: #30363d; stroke-width: 1; }
        .window-bar { fill: #161b22; stroke: #30363d; stroke-width: 1; }
        .dot-red { fill: #ff5f56; }
        .dot-yellow { fill: #ffbd2e; }
        .dot-green { fill: #27c93f; }
        .text-cmd { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, Courier, monospace; font-size: 16px; fill: #79c0ff; font-weight: bold; }
        .text-output { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, Courier, monospace; font-size: 16px; fill: #c9d1d9; }
        .cursor { fill: #c9d1d9; animation: blink 1s step-end infinite; }
        
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
    </style>
    
    <rect width="100%" height="100%" rx="8" ry="8" class="bg" />
    <path d="M 0 8 A 8 8 0 0 1 8 0 L 792 0 A 8 8 0 0 1 800 8 L 800 30 L 0 30 Z" class="window-bar" />
    <circle cx="20" cy="15" r="6" class="dot-red" />
    <circle cx="40" cy="15" r="6" class="dot-yellow" />
    <circle cx="60" cy="15" r="6" class="dot-green" />
    
    <g transform="translate(30, 70)">
        <text y="0" class="text-cmd">&gt; whoami</text>
        <text y="30" class="text-output">Ayotomiwa Apelegan</text>
        
        <text y="80" class="text-cmd">&gt; role</text>
        <text y="110" class="text-output">Backend Engineer &#183; Software Engineer</text>
        
        <text y="160" class="text-cmd">&gt; focus</text>
        <text y="190" class="text-output">backend systems &#183; APIs &#183; infrastructure &#183; AI <tspan class="cursor" dy="1">&#9608;</tspan></text>
    </g>
</svg>